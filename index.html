<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Make the Call</title>
<meta name="theme-color" content="#0b0b0b">
<meta name="description" content="A walk through the 37signals Guide to Making Decisions: 38 questions, one card at a time.">
<style>
  /* Always dark */
  :root {
    --paper: #0b0b0b;
    --card: #151515;
    --ink: #ffffff;
    --muted: #a3a3a3;
    --line: #353535;
    --trail: #ffffff;
    --walk: #3a3a3a;
    --marker: #ffffff;
    --marker-ink: #000000;
    --done: #262626;
    --focus: #7aa7ff;
    --display: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --body: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 17px/1.5 var(--body); overflow: hidden; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Top bar */
  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--card);
    position: relative; z-index: 2;
  }
  .brand { font: 800 19px/1 var(--display); letter-spacing: -.02em; white-space: nowrap; }
  .brand span { display: none; }
  .deciding { flex: 1 1 200px; min-width: 0; color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .deciding b { color: var(--ink); font-weight: 600; }
  .stats { display: flex; gap: 14px; align-items: center; font: 500 13px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats .late { color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .tools { display: flex; gap: 8px; }
  .btn {
    border: 1px solid var(--ink); background: var(--card); border-radius: 4px;
    padding: 7px 12px; min-height: 38px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .btn:hover { background: var(--done); }
  .btn.primary, .btn.marker { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 600; }
  .btn.primary:hover, .btn.marker:hover { opacity: .85; background: var(--ink); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--ink); background: transparent; text-decoration: underline; }

  /* Map viewport */
  .viewport {
    position: relative; flex: 1; overflow: hidden; cursor: default;
    background-color: var(--paper);
  }
  .viewport.map { cursor: grab; touch-action: none; }
  .viewport.dragging { cursor: grabbing; }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .world.animate { transition: transform .65s cubic-bezier(.3, .7, .2, 1); }
  .trail { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .trail path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .trail .all { stroke: var(--walk); stroke-width: 4; stroke-dasharray: 1 14; }
  .trail .walked { stroke: var(--trail); stroke-width: 4; }

  .credit {
    padding: 10px 20px; border-top: 1px solid var(--line); background: var(--card);
    font-size: 12px; line-height: 1.4; color: var(--muted); position: relative; z-index: 2;
  }
  .credit a { color: var(--ink); }
  .hint { position: absolute; right: 16px; bottom: 12px; font-size: 13px; color: var(--muted); pointer-events: none; }

  /* Stations */
  .card {
    position: absolute; padding: 28px 30px 24px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin;
    background: var(--card); border: 1px solid var(--line); border-radius: 4px;
    display: flex; flex-direction: column; gap: 14px;
    transition: opacity .4s, border-color .3s, background-color .3s;
  }
  .viewport:not(.map) .card:not(.current) { cursor: pointer; border-color: var(--walk); }
  .viewport:not(.map) .card:not(.current) > * { opacity: .25; transition: opacity .4s; }
  .viewport:not(.map) .card:not(.current) * { pointer-events: none; }
  .card.current { border-color: var(--muted); }
  .card-top { display: flex; align-items: baseline; gap: 8px; font: 500 13px/1 var(--mono); color: var(--muted); }
  .card-top .n { font: 800 15px/1 var(--mono); color: var(--ink); }
  .card-top .state { margin-left: auto; font-family: var(--body); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .card.answered .state { color: var(--ink); font-weight: 700; }
  .q { margin: 0; font: 800 27px/1.2 var(--display); letter-spacing: -.02em; text-wrap: balance; }
  .tip {
    margin: 0; padding: 2px 0 2px 14px; border-left: 3px solid var(--ink);
    font-size: 15px; line-height: 1.45;
  }
  .tip p { margin: 0; }
  .tip cite { display: block; margin-top: 4px; font-style: normal; font-size: 12px; color: var(--muted); }
  .tip cite a { color: inherit; }
  textarea {
    flex: 1; min-height: 90px; width: 100%; resize: none; border: 1px solid var(--line); border-radius: 4px;
    background: var(--paper); padding: 10px 12px; line-height: 1.45; font-size: 17px;
  }
  textarea:focus, input[type=text]:focus { outline: none; border-color: var(--ink); }
  .card-actions { display: flex; gap: 8px; align-items: center; margin-top: auto; }
  .card-actions .spacer { flex: 1; }
  .card.end .card-actions { flex-wrap: wrap; }
  .card-top .reset-link { margin-left: auto; min-height: 0; padding: 0; font-size: 14px; }
  /* Viewing someone else's shared decision: read-only */
  .shared-note { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
  .shared .mic, .shared .micbox, .shared .btn.exit, .shared [data-reset], .shared #timer { display: none !important; }
  .kbd { font: 500 11px/1 var(--mono); color: var(--muted); }

  /* Shortcuts to the finish */
  .btn.exit { align-self: flex-start; border-style: dashed; white-space: normal; text-align: left; }
  .exit-tag { display: none; font: 700 30px/1 var(--body); }
  .far .exit-tag { display: block; margin-top: auto; }
  .exit-note { margin: 0; padding: 8px 12px; border: 1px dashed var(--ink); border-radius: 4px; font-size: 15px; }
  .exit-note:empty { display: none; }

  /* Dictation */
  .mic svg { width: 16px; height: 16px; flex: none; }
  .mic.listening { background: #d0021b; border-color: #d0021b; color: #fff; }
  [hidden] { display: none !important; }
  /* While dictating, the Dictate button splits into Reset and Next at the same width */
  .micbox { display: inline-flex; width: 196px; }
  .micbox > .mic { width: 100%; }
  .mic-live { display: flex; width: 100%; }
  .mic-live .btn { flex: 1; padding-inline: 6px; border-color: #d0021b; }
  .mic-live .live-reset { color: #ff6b6b; border-radius: 4px 0 0 4px; }
  .mic-live .live-next { background: #d0021b; color: #fff; font-weight: 600; border-radius: 0 4px 4px 0; margin-left: -1px; }
  .mic-live .live-next::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pulse 1s ease-in-out infinite; }
  .mic-live .live-reset:hover { background: transparent; text-decoration: underline; }
  .mic-live .live-next:hover { background: #b00017; }
  .mic.listening svg { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .input-row { display: flex; gap: 8px; }
  .input-row input { flex: 1; min-width: 0; }
  .input-row .mic { flex: none; width: 44px; padding: 0; }
  .dictation-msg { margin: 0; font-size: 13px; color: var(--muted); }
  .dictation-msg:empty { display: none; }
  .no-speech .mic { display: none; }

  .card.start h1 { margin: 0; font: 800 44px/1 var(--display); letter-spacing: -.035em; }
  .card.start .lede { margin: 0; font-size: 17px; }
  .card.start .lede a { color: var(--ink); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > span, .field legend { font-weight: 700; font-size: 15px; padding: 0; }
  input[type=text] { border: 1px solid var(--line); border-radius: 4px; background: var(--paper); padding: 9px 12px; width: 100%; font-size: 17px; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  .choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .choices label { cursor: pointer; }
  .langs { margin-left: auto; display: flex; gap: 14px; font: 500 14px/1 var(--body); }
  .langs label { cursor: pointer; }
  .langs input { position: absolute; opacity: 0; pointer-events: none; }
  .langs span { color: var(--muted); padding-bottom: 3px; border-bottom: 2px solid transparent; }
  .langs input:checked + span { color: var(--ink); border-bottom-color: var(--ink); }
  .langs input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 3px; }
  .choices input { position: absolute; opacity: 0; pointer-events: none; }
  .choices span { display: inline-block; border: 1px solid var(--ink); border-radius: 4px; padding: 6px 12px; font-size: 15px; }
  .choices input:checked + span { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .choices input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
  .sources { font-size: 12px; color: var(--muted); margin: 0; }
  .sources a { color: inherit; }
  .card.end .summary { font: 500 13px/1.4 var(--mono); color: var(--muted); margin: 0; }
  .copied { font-size: 14px; font-weight: 600; }

  /* Zoomed out: cards become map tiles */
  .far .card { padding: 40px; overflow: hidden; border: 6px solid var(--line); gap: 24px; }
  .far .card .tip, .far .card textarea, .far .card .card-actions, .far .card .lede,
  .far .card .field, .far .card .sources, .far .card .summary, .far .card .dictation-msg,
  .far .card .btn.exit, .far .card .exit-note { display: none; }
  .far .card-top { font-size: 30px; color: inherit; }
  .far .card-top > span:not(.n) { display: none; }
  .far .card-top .n { font: 800 150px/.9 var(--display); color: inherit; letter-spacing: -.04em; }
  .far .q { font-size: 58px; line-height: 1.1; letter-spacing: -.02em;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 7; overflow: hidden; }
  .far .card.start h1 { font-size: 80px; }
  .far .exit-tag { font-size: 40px; }
  .far .card:has(.exit-tag) .q { -webkit-line-clamp: 5; }
  /* Answered: solid black. Skipped: dashed. Not reached yet: light grey outline. */
  .far .card.answered { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .far .card.skipped { border-style: dashed; border-color: var(--muted); }
  /* Questions after a shortcut you took: fade the content, keep the card opaque so the trail stays hidden */
  .far .card.bypassed { border-color: var(--walk); border-style: solid; background: var(--card); color: var(--ink); }
  .far .card.bypassed > * { opacity: .3; }
  .far .card.current { outline: 16px solid var(--ink); outline-offset: 18px; }
  .far .card { cursor: pointer; }
  .far .card:hover { border-color: var(--ink); }
  .pin {
    position: absolute; display: none; transform: translate(-50%, -100%);
    background: var(--marker); color: var(--marker-ink); font: 800 56px/1 var(--display);
    padding: 18px 30px; border-radius: 6px; white-space: nowrap; pointer-events: none;
  }
  .pin::after { content: ""; position: absolute; left: 50%; bottom: -22px; margin-left: -22px; border: 22px solid transparent; border-bottom: 0; border-top-color: var(--marker); }
  .far .pin { display: block; }

  .credit .short { display: none; }
  @media (max-width: 640px) {
    .bar { padding: 8px 12px; gap: 6px 10px; }
    /* Row 1: title and buttons. Row 2: progress, timer and the decision. */
    .brand { order: 1; flex: 1; font-size: 17px; }
    .tools { order: 2; }
    .stats { order: 3; gap: 10px; font-size: 12px; }
    .stats .wide { display: none; }
    .deciding { order: 4; flex: 1 1 0; font-size: 13px; }
    .shared-note { order: 5; flex-basis: 100%; justify-content: space-between; font-size: 13px; }
    .hint { display: none; }
    .tools .btn { padding: 6px 10px; }
    .card { padding: 20px 18px 16px; gap: 12px; }
    .q { font-size: 22px; }
    .card.start h1 { font-size: 32px; }
    .kbd { display: none; }
    .card-actions .btn { min-height: 44px; }
    .card-actions .spacer { display: none; }
    .micbox { width: auto; flex: 1; min-width: 0; }
    .mic-live .btn { font-size: 13px; padding-inline: 4px; }
    .credit { padding: 6px 12px; font-size: 11px; }
    .credit .long { display: none; }
    .credit .short { display: inline; }
  }
  @media (prefers-reduced-motion: reduce) {
    .world.animate { transition: none; }
  }
</style>
</head>
<body>

<header class="bar">
  <div class="brand"><span>?</span><b class="name">Make the Call</b></div>
  <div class="deciding" id="deciding">Answer questions from the 37signals guide, one question at a time.</div>
  <div class="stats">
    <span id="progress">0 / 38 answered</span>
    <span id="timer" title="Jason and David say most of their calls take about five minutes">0:00</span>
  </div>
  <div class="shared-note" id="sharedNote" hidden><span id="sharedText"></span><button class="btn" id="ownBtn" type="button"></button></div>
  <div class="tools">
    <button class="btn" id="zoomBtn" type="button">Zoom out</button>
    <button class="btn" id="callBtn" type="button">Make the call</button>
  </div>
</header>

<main class="viewport" id="viewport">
  <div class="world animate" id="world">
    <svg class="trail" id="trail"><path class="all" id="trailAll"/><path class="walked" id="trailWalked"/></svg>
    <div class="pin" id="pin">You are here</div>
  </div>
  <div class="hint" id="hint">Z zooms out · Ctrl/⌘+Enter goes to the next question</div>
</main>

<footer class="credit">
  <span class="short" id="footShort"></span>
  <span class="long" id="footLong"></span>
</footer>

<script>
(function () {
  "use strict";

  var GUIDE = "https://37signals.com/how-we-make-decisions";
  var EPISODE = "https://37signals.com/podcast/one-way-doors/";
  var SITE = "https://37signals.com";
  var MADE_EN = " Made by " + '<a href="https://jankeesvw.com" target="_blank" rel="noopener">jankeesvw</a>' + " at " + '<a href="https://wbso.ai" target="_blank" rel="noopener">WBSO.ai</a>' + ".";
  var MADE_NL = " Gemaakt door " + '<a href="https://jankeesvw.com" target="_blank" rel="noopener">jankeesvw</a>' + " bij " + '<a href="https://wbso.ai" target="_blank" rel="noopener">WBSO.ai</a>' + ".";
  function link(href, text) { return '<a href="' + href + '" target="_blank" rel="noopener">' + text + '</a>'; }

  // The 38 questions, in the order they appear in The 37signals Guide to Making Decisions.
  // English is the original; Dutch is our own unofficial translation.
  var QUESTIONS = {
    en: [
      "Why are we deciding anything at all? Does a decision actually need to be made here?",
      "Is the right person making this decision? Not the right role, but the right person with the right information, context, and insight? Who’s merely chiming in?",
      "If we remove the immediate impact, how do we think we’ll feel about this decision a year from now?",
      "Why hasn’t this decision been made already? Why didn’t we decide before?",
      "What’s taking so long to make this decision? Why are we hesitating? What does that reveal?",
      "Why would someone else make a different decision? What’s the other side — or two or three — look like?",
      "Can we make this decision smaller? Can we take one big decision and turn it into three smaller ones?",
      "How easily can we reverse the decision?",
      "What was our first instinct on this decision? Are we now just walking around in circles trying to justify that gut reaction with data?",
      "What would happen if we just didn’t make the decision?",
      "What happened the last time we made a decision like this?",
      "What are we looking forward to after the decision is made? What are we afraid of?",
      "How can we make this decision easier? What parts can we eliminate from consideration?",
      "Is there even a wrong decision?",
      "Do we anticipate making a different decision if we wait until tomorrow morning to make it?",
      "Is any decision better than no decision, or is no decision better than any decision?",
      "What other decisions will be impacted by this decision?",
      "Will this decision eliminate the need to make other decisions, or will it create the necessity to make even more decisions?",
      "What missing information would lead to making a different decision?",
      "Will this decision make more work for people that don’t have extra time for that work? Or will it eliminate work?",
      "Could this decision be a good one for someone else to practice making?",
      "When do we have to decide?",
      "Will this be a one-and-done decision, or will this be a repeating decision?",
      "Is anyone outside the company depending on this, or is this a decision of our own making?",
      "How does this decision impact customers vs. impact us?",
      "Is this primarily a data-based decision, or an intuition, gut-based decision?",
      "Would another opinion help or hinder?",
      "If we were forced to make a decision right this second, what would it be?",
      "Where do we think we’d be today if we made this decision 90 days ago?",
      "Is there anything in this decision we’d regret if we didn’t take X, Y, or Z into consideration?",
      "Do you even care which way this goes? If not, why are you involved?",
      "When and how will we know whether the decision was the right one, or if it even mattered?",
      "When the consequences of our decision appear, are they likely to be visible with the naked eye or do they require a microscope to detect? If the latter, does it even matter?",
      "What principles are we bending if we make this decision?",
      "Are we asking multiple people to make a decision that one person should be making?",
      "Is the return on effort worth it?",
      "What gets easier if we make this decision? What gets harder? Will easier remain easier in the long term, or is it short-term easy but long-term hard? And vice versa.",
      "In the end, is this about money?"
    ],
    nl: [
      "Waarom beslissen we hier eigenlijk iets? Moet hier echt een beslissing genomen worden?",
      "Neemt de juiste persoon deze beslissing? Niet de juiste rol, maar de juiste persoon, met de juiste informatie, context en inzichten? Wie praat alleen maar mee?",
      "Als we de directe impact wegdenken, hoe denken we dan over een jaar over deze beslissing?",
      "Waarom is deze beslissing nog niet genomen? Waarom hebben we niet eerder besloten?",
      "Waarom duurt het zo lang om deze beslissing te nemen? Waarom aarzelen we? Wat zegt dat?",
      "Waarom zou iemand anders een andere beslissing nemen? Hoe ziet de andere kant eruit, of de twee of drie andere kanten?",
      "Kunnen we deze beslissing kleiner maken? Kunnen we van één grote beslissing drie kleinere maken?",
      "Hoe makkelijk kunnen we deze beslissing terugdraaien?",
      "Wat was ons eerste instinct bij deze beslissing? Lopen we nu in rondjes om dat onderbuikgevoel met data te rechtvaardigen?",
      "Wat zou er gebeuren als we de beslissing gewoon niet namen?",
      "Wat gebeurde er de vorige keer dat we zo’n beslissing namen?",
      "Waar kijken we naar uit als de beslissing genomen is? Waar zijn we bang voor?",
      "Hoe kunnen we deze beslissing makkelijker maken? Welke delen kunnen we buiten beschouwing laten?",
      "Bestaat er eigenlijk wel een verkeerde beslissing?",
      "Verwachten we een andere beslissing te nemen als we wachten tot morgenochtend?",
      "Is elke beslissing beter dan geen beslissing, of is geen beslissing beter dan welke beslissing ook?",
      "Welke andere beslissingen worden door deze beslissing geraakt?",
      "Maakt deze beslissing andere beslissingen overbodig, of moeten we daardoor juist nog meer beslissingen nemen?",
      "Welke ontbrekende informatie zou tot een andere beslissing leiden?",
      "Levert deze beslissing extra werk op voor mensen die daar geen tijd voor hebben? Of haalt ze juist werk weg?",
      "Zou dit een goede beslissing zijn voor iemand anders om mee te oefenen?",
      "Wanneer moeten we beslissen?",
      "Is dit een eenmalige beslissing, of een die steeds terugkomt?",
      "Is iemand buiten het bedrijf hiervan afhankelijk, of is dit een beslissing die we onszelf hebben opgelegd?",
      "Wat doet deze beslissing met klanten, en wat met ons?",
      "Is dit vooral een beslissing op basis van data, of een beslissing op intuïtie en gevoel?",
      "Helpt een extra mening, of zit die juist in de weg?",
      "Als we nu, op dit moment, moesten beslissen, wat zou het dan worden?",
      "Waar denken we dat we nu zouden staan als we deze beslissing 90 dagen geleden hadden genomen?",
      "Is er iets aan deze beslissing waar we spijt van zouden krijgen als we X, Y of Z niet meewogen?",
      "Kan het je eigenlijk schelen welke kant dit op gaat? Zo niet, waarom ben je er dan bij betrokken?",
      "Wanneer en hoe weten we of dit de juiste beslissing was, of dat het überhaupt uitmaakte?",
      "Als de gevolgen van onze beslissing zichtbaar worden, zijn ze dan met het blote oog te zien, of heb je een microscoop nodig om ze te ontdekken? In dat laatste geval: maakt het dan wel uit?",
      "Welke principes buigen we als we deze beslissing nemen?",
      "Vragen we meerdere mensen om een beslissing te nemen die één persoon zou moeten nemen?",
      "Is de opbrengst de moeite waard?",
      "Wat wordt er makkelijker als we deze beslissing nemen? Wat wordt er moeilijker? Blijft makkelijk ook op lange termijn makkelijk, of is het op korte termijn makkelijk en op lange termijn moeilijk? En andersom.",
      "Gaat dit uiteindelijk om geld?"
    ]
  };

  // Quotes from REWORK episode 201, "One-way Doors", keyed by question number: [speaker, timestamp, English, Dutch].
  var TIPS = {
    3: ["Jason Fried", "07:22",
      "Pretty much every decision you make in the business doesn’t really matter. It could have gone a hundred different ways and would’ve turned out the same way or differently.",
      "Eigenlijk maakt bijna elke beslissing die je in het bedrijf neemt niet echt uit. Het had op honderd verschillende manieren kunnen gaan en was dan hetzelfde of anders uitgepakt."],
    5: ["David Heinemeier Hansson", "04:21",
      "If we can’t make a decision quite quickly, it’s usually because there’s something right under the surface. It’s not lack of information.",

    6: ["David Heinemeier Hansson", "10:57",

    setRadio("door", state.door);
    setRadio("call", state.call);
    setRadio("lang", state.lang);

    if (sharedMode) enterSharedMode();
    if (!SR || !window.isSecureContext) {
      cards[0].querySelector(".dictation-msg").textContent = window.isSecureContext ? t.noSpeech : t.needHttps;
    }
  }
  function setRadio(name, value) {
    document.querySelectorAll('input[name="' + name + '"]').forEach(function (r) { r.checked = r.value === value; });
  }
  function setLanguage(lang) {
    stopDictation();
    state.lang = lang;
    save();
    var wasMap = mode === "map";
    render();
    layout();
    refresh();
    if (wasMap) centerOn(worldW / 2, worldH / 2, mapScale(), false); else focusCurrent(false);
  }

  // ---------- Layout: a winding trail ----------
  var worldW = 0, worldH = 0;
  function layout() {
    var r = viewport.getBoundingClientRect();
    if (r.width < 640) {
      CARD_W = Math.round(r.width - 20);
      CARD_H = Math.round(Math.max(240, r.height - 20));
    } else {
      // Make every card as tall as the tallest one needs, so none of them has to scroll.
      CARD_W = 540;
      var wasFar = world.classList.contains("far");
      world.classList.remove("far");
      var tallest = 0;
      cards.forEach(function (c) {
        c.style.width = CARD_W + "px";
        c.style.height = "auto";
        tallest = Math.max(tallest, c.offsetHeight);
      });
      if (wasFar) world.classList.add("far");
      CARD_H = Math.max(560, tallest + 48);   // room for a dictation message line
    }
    var aspect = Math.max(.4, r.width / Math.max(1, r.height));
    var cellW = CARD_W + GAP_X, cellH = CARD_H + GAP_Y;
    var cols = Math.max(3, Math.min(10, Math.round(Math.sqrt(STATIONS * aspect * cellH / cellW))));
    var rows = Math.ceil(STATIONS / cols);
    positions = [];
    for (var k = 0; k < STATIONS; k++) {
      var row = Math.floor(k / cols), ci = k % cols;
      var col = row % 2 ? cols - 1 - ci : ci;
      var x = PAD + col * cellW, y = PAD + row * cellH;
      positions.push({ x: x, y: y, cx: x + CARD_W / 2, cy: y + CARD_H / 2 });
      cards[k].style.left = x + "px";
      cards[k].style.top = y + "px";
      cards[k].style.width = CARD_W + "px";
      cards[k].style.height = CARD_H + "px";
    }
    worldW = PAD * 2 + cols * cellW - GAP_X;
    worldH = PAD * 2 + rows * cellH - GAP_Y;
    world.style.width = worldW + "px";
    world.style.height = worldH + "px";
    var svg = document.getElementById("trail");
    svg.setAttribute("width", worldW);
    svg.setAttribute("height", worldH);
    document.getElementById("trailAll").setAttribute("d", pathTo(STATIONS - 1));
    drawProgress();
  }
  function pathTo(last) {
    var d = "";
    for (var k = 0; k <= last; k++) d += (k ? " L" : "M") + positions[k].cx + " " + positions[k].cy;
    return d;
  }
  function drawProgress() {
    var d = state.current > 0 ? pathTo(state.current) : "";
    if (exitTaken()) d = pathTo(state.exit.from) + " L" + positions[END].cx + " " + positions[END].cy;
    document.getElementById("trailWalked").setAttribute("d", d);
    var p = positions[state.current];
    pin.style.left = p.cx + "px";
    pin.style.top = (p.y - 30) + "px";
  }

  // ---------- Camera ----------
  function view() { var r = viewport.getBoundingClientRect(); return { w: r.width, h: r.height }; }
  function focusScale() {
    var v = view();
    return Math.min(1.1, (v.w - 20) / CARD_W, (v.h - 20) / CARD_H);
  }
  function mapScale() {
    var v = view();
    return Math.min((v.w - 24) / worldW, (v.h - 24) / worldH);
  }
  function apply(animate) {
    world.classList.toggle("animate", !!animate);
    world.style.transform = "translate(" + cam.x + "px," + cam.y + "px) scale(" + cam.s + ")";
    var far = cam.s < focusScale() * 0.6;
    world.classList.toggle("far", far);
    viewport.classList.toggle("map", far);
    mode = far ? "map" : "focus";
    document.getElementById("zoomBtn").textContent = far ? T().zoomIn : T().zoomOut;
  }
  function centerOn(cx, cy, s, animate) {
    var v = view();
    cam.s = s;
    cam.x = v.w / 2 - cx * s;
    cam.y = v.h / 2 - cy * s;
    apply(animate);
  }
  function focusCurrent(animate) {
    var p = positions[state.current];
    centerOn(p.cx, p.cy, focusScale(), animate);
  }
  function zoomOut() {
    centerOn(worldW / 2, worldH / 2, mapScale(), true);
  }

  // ---------- Navigation ----------
  function go(k, focusInput) {
    k = Math.max(0, Math.min(END, k));
    stopDictation();
    if (k > 0 && !state.startedAt) state.startedAt = Date.now();
    state.current = k;
    save();
    refresh();
    focusCurrent(true);
    if (focusInput !== false) {
      setTimeout(function () {
        var t = cards[k].querySelector("textarea:not(.sr), input[type=text]");
        if (t && window.matchMedia("(pointer: fine)").matches) t.focus({ preventScroll: true });
        viewport.scrollTop = 0; viewport.scrollLeft = 0;
      }, 450);
    }
  }
  function next(i) {
    if (state.exit && i >= state.exit.from) state.exit = null;   // walking on past a shortcut cancels it
    go(i + 1);
  }
  function exitTaken() { return !!state.exit && state.current === END; }
  function takeExit(q) {
    var x = EXITS[q];
    state.exit = { from: q };
    if (x.call) { state.call = x.call; setRadio("call", x.call); }
    go(END);
  }

  // ---------- Render state ----------
  function answeredCount() {
    var n = 0;
    for (var k = 1; k <= N; k++) if ((state.answers[k] || "").trim()) n++;
    return n;
  }
  function refresh() {
    var t = T();
    cards.forEach(function (c, k) {
      c.classList.toggle("current", k === state.current);
      var answered = k > 0 && k <= N && !!(state.answers[k] || "").trim();
      c.classList.toggle("answered", answered || (k === 0 && !!state.decision.trim()) || (k === END && !!state.call));
      var st = c.querySelector(".state");
      if (k > 0 && k <= N) {
        var reached = exitTaken() ? state.exit.from : state.current;
        st.textContent = answered ? t.stateAnswered : (k < reached ? t.stateSkipped : "");
        c.classList.toggle("skipped", !answered && k < reached);
        c.classList.toggle("bypassed", !!state.exit && k > state.exit.from);
        var btn = c.querySelector("[data-next]");
        btn.textContent = answered ? t.next : t.skip;
      }
    });
    document.getElementById("progress").innerHTML = answeredCount() + " / " + N + '<span class="wide"> ' + t.answered + '</span>';
    var d = document.getElementById("deciding");
    d.innerHTML = state.decision.trim() ? t.deciding + " <b>" + esc(state.decision) + "</b>" : "";
    // 5. Only offer Start over on the start card once there is something to clear
    cards[0].querySelector("[data-reset]").hidden = !(state.decision.trim() || state.door || answeredCount() || state.call || state.callText.trim());
    document.getElementById("exitNote").textContent = state.exit ? t.exitNote(state.exit.from, exitText(state.exit.from)[1]) : "";
    updateShare();
    document.getElementById("summary").textContent = t.summary(answeredCount(), N, elapsed()) + " " + doorLine();
    drawProgress();
  }
  function doorLine() {
    return T().doors[state.door] || "";
  }
  function elapsed() {
    if (!sharedMode && !state.startedAt) return "0:00";
    var s = sharedMode ? sharedElapsed : Math.floor((Date.now() - state.startedAt) / 1000);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }
  function tick() {
    var t = document.getElementById("timer");
    t.textContent = elapsed();
    t.classList.toggle("late", !!state.startedAt && Date.now() - state.startedAt > 5 * 60 * 1000);
  }

  // ---------- Events ----------
  world.addEventListener("input", function (e) {
    var t = e.target;
    if (t.id === "decision") state.decision = t.value;
    else if (t.id === "callText") state.callText = t.value;
    else if (t.dataset.q) state.answers[t.dataset.q] = t.value;
    else return;
    save();
    refresh();
  });
  world.addEventListener("change", function (e) {
    var t = e.target;
    if (t.name === "door") { state.door = t.value; save(); refresh(); }
    else if (t.name === "call") { state.call = t.value; save(); refresh(); }
    else if (t.name === "lang") setLanguage(t.value);
  });

  var dragMoved = false;
  world.addEventListener("click", function (e) {
    if (dragMoved) return;
    var card = e.target.closest(".card");
    if (!card) return;
    var k = +card.dataset.i;
    if (mode === "map" || k !== state.current) { e.preventDefault(); go(k); return; }
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.go != null) go(+b.dataset.go);
    else if (b.dataset.next != null) next(+b.dataset.next);
    else if (b.dataset.exit != null) takeExit(+b.dataset.exit);
    else if (b.id === "copy") copyText(markdown(), T().copied);
    else if (b.id === "share") copyText(shareUrl || location.href, T().linkCopied);
    else if (b.hasAttribute("data-reset")) resetQuest(b);
    else if (b.dataset.mic) toggleDictation(b);
    else if (b.hasAttribute("data-mic-reset")) { if (recReset) recReset(); }
    else if (b.dataset.micNext != null) next(+b.dataset.micNext);
  });

  document.getElementById("zoomBtn").addEventListener("click", function () {
    if (mode === "map") focusCurrent(true); else zoomOut();
  });
  document.getElementById("callBtn").addEventListener("click", function () { go(END); });

  document.addEventListener("keydown", function (e) {
    var typing = /^(TEXTAREA|INPUT)$/.test(e.target.tagName) && e.target.type !== "radio";
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      if (state.current < END) next(state.current);
      return;
    }
    if (e.key === "Enter" && e.target.id === "decision") { e.preventDefault(); go(1); return; }
    if (e.key === "Escape" && rec) { stopDictation(); return; }
    if (e.key === "Escape" && typing) { e.target.blur(); return; }
    if (typing) return;
    if (e.key === "z" || e.key === "Z" || e.key === "-") { e.preventDefault(); if (mode === "map") focusCurrent(true); else zoomOut(); }
    else if (e.key === "Enter" || e.key === "+" || e.key === "=") { if (mode === "map") { e.preventDefault(); focusCurrent(true); } }
    else if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); go(state.current + 1, false); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); go(state.current - 1, false); }
  });

  // Drag to pan while zoomed out, wheel or trackpad pinch to zoom anywhere.
  var drag = null;
  viewport.addEventListener("pointerdown", function (e) {
    dragMoved = false;
    if (mode !== "map" && e.target.closest(".card.current")) return;
    if (mode !== "map" && e.pointerType === "touch") return;
    if (e.target.closest("button, a, input, textarea, label")) return;
    drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, id: e.pointerId };
  });
  window.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!dragMoved && Math.abs(dx) + Math.abs(dy) < 6) return;
    dragMoved = true;
    viewport.classList.add("dragging");
    cam.x = drag.cx + dx; cam.y = drag.cy + dy;
    apply(false);
  });
  window.addEventListener("pointerup", function () {
    drag = null;
    viewport.classList.remove("dragging");
    setTimeout(function () { dragMoved = false; }, 0);
  });
  viewport.addEventListener("wheel", function (e) {
    if (mode !== "map" && !e.ctrlKey && e.target.closest(".card.current")) return;
    e.preventDefault();
    var r = viewport.getBoundingClientRect();
    var px = e.clientX - r.left, py = e.clientY - r.top;
    var min = mapScale() * 0.8, max = focusScale() * 1.3;
    var ns = Math.max(min, Math.min(max, cam.s * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015))));
    cam.x = px - (px - cam.x) * (ns / cam.s);
    cam.y = py - (py - cam.y) * (ns / cam.s);
    cam.s = ns;
    apply(false);
  }, { passive: false });
  viewport.addEventListener("scroll", function () { viewport.scrollTop = 0; viewport.scrollLeft = 0; });

  var resizeTimer;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var wasMap = mode === "map";
      layout();
      if (wasMap) { cam.s = mapScale(); centerOn(worldW / 2, worldH / 2, cam.s, false); } else focusCurrent(false);
    }, 120);
  });

  // ---------- Export ----------
  function markdown() {
    var t = T();
    var out = ["# " + (state.decision.trim() || t.mdUntitled), ""];
    if (doorLine()) out.push(doorLine());
    if (state.exit) out.push(t.mdEarly(state.exit.from, exitText(state.exit.from)[1]));
    out.push(t.mdTime(elapsed(), answeredCount(), N), "");
    if (state.call || state.callText.trim()) {
      out.push(t.mdCall, "");
      if (state.call) out.push("**" + t.calls[state.call] + ".** " + state.callText.trim()); else out.push(state.callText.trim());
      out.push("");
    }
    out.push(t.mdAnswers, "");
    for (var k = 1; k <= N; k++) {
      var a = (state.answers[k] || "").trim();
      if (a) out.push("**" + k + ". " + question(k) + "**", "", a, "");
    }
    out.push(t.mdGuide);
    for (var q in TIPS) if ((state.answers[q] || "").trim()) { out.push(t.mdQuotes); break; }
    return out.join("\n");
  }
  function copyText(text, okMsg) {
    var t = T();
    var shown = document.getElementById("copied");
    function done(msg) { shown.textContent = msg; shown.hidden = false; setTimeout(function () { shown.hidden = true; }, 2200); }
    function fallback() {
      var f = document.getElementById("copyFallback");
      f.value = text; f.select();
      try { document.execCommand("copy") ? done(okMsg) : done(t.pressCopy); } catch (e) { done(t.pressCopy); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(okMsg); }, fallback);
    else fallback();
  }

  // ---------- Share link: the whole decision packed into the URL, nothing stored on a server ----------
  var shareUrl = "", shareTimer = null;
  function b64u(bytes) {
    var s = "";
    for (var k = 0; k < bytes.length; k++) s += String.fromCharCode(bytes[k]);
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function unb64u(str) {
    var s = atob(str.replace(/-/g, "+").replace(/_/g, "/")), b = new Uint8Array(s.length);
    for (var k = 0; k < s.length; k++) b[k] = s.charCodeAt(k);
    return b;
  }
  function pipe(bytes, stream) {
    return new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer().then(function (buf) { return new Uint8Array(buf); });
  }
  function encodeShare(obj) {
    var bytes = new TextEncoder().encode(JSON.stringify(obj));
    if (window.CompressionStream) return pipe(bytes, new CompressionStream("deflate-raw")).then(function (z) { return "z" + b64u(z); });
    return Promise.resolve("j" + b64u(bytes));
  }
  function decodeShare(code) {
    var bytes = unb64u(code.slice(1));
    var p = code[0] === "z" ? pipe(bytes, new DecompressionStream("deflate-raw")) : Promise.resolve(bytes);
    return p.then(function (b) { return JSON.parse(new TextDecoder().decode(b)); });
  }
  function sharePayload() {
    var a = {};
    for (var k = 1; k <= N; k++) if ((state.answers[k] || "").trim()) a[k] = state.answers[k].trim();
    var secs = sharedMode ? sharedElapsed : (state.startedAt ? Math.floor((Date.now() - state.startedAt) / 1000) : 0);
    return { v: 1, d: state.decision, o: state.door, a: a, c: state.call, t: state.callText, x: state.exit ? state.exit.from : 0, l: state.lang, e: secs };
  }
  function stateFromPayload(p) {
    var st = fresh();
    st.decision = String(p.d || "");
    st.door = ["one-way", "two-way", "unsure"].indexOf(p.o) >= 0 ? p.o : "";
    for (var k in (p.a || {})) if (+k >= 1 && +k <= N) st.answers[k] = String(p.a[k]);
    st.call = CALLS.indexOf(p.c) >= 0 ? p.c : "";
    st.callText = String(p.t || "");
    st.exit = EXITS[p.x] ? { from: +p.x } : null;
    st.lang = p.l === "nl-NL" ? "nl-NL" : "en-US";
    st.current = END;
    return st;
  }
  function updateShare() {
    clearTimeout(shareTimer);
    shareTimer = setTimeout(function () {
      encodeShare(sharePayload()).then(function (code) {
        shareUrl = location.origin + location.pathname + "#share=" + code;
      }, function () { shareUrl = ""; });
    }, 250);
  }
  function enterSharedMode() {
    document.body.classList.add("shared");
    world.querySelectorAll("input, textarea").forEach(function (el) {
      if (el.name === "lang" || el.id === "copyFallback") return;
      if (el.type === "radio") el.disabled = true; else el.readOnly = true;
    });
    var t = T();
    document.getElementById("sharedNote").hidden = false;
    document.getElementById("sharedText").textContent = t.sharedNote;
    document.getElementById("ownBtn").textContent = t.startOwn;
  }
  document.getElementById("ownBtn").addEventListener("click", function () {
    history.replaceState(null, "", location.pathname);
    location.reload();
  });
  window.addEventListener("hashchange", function () {
    if (location.hash.indexOf("#share=") === 0) location.reload();
  });

  var resetArmed = null;
  function resetQuest(b) {
    if (!resetArmed) {
      b.textContent = T().clearAll;
      resetArmed = setTimeout(function () { b.textContent = T().startOver; resetArmed = null; }, 3000);
      return;
    }
    clearTimeout(resetArmed); resetArmed = null;
    var lang = state.lang;
    state = fresh();
    state.lang = lang;
    save();
    render();
    go(0);
  }

  // ---------- Dictation (Web Speech API, on-device when the browser offers it) ----------
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, recBtn = null, recReset = null;
  if (!SR || !window.isSecureContext) document.body.classList.add("no-speech");

  function say(btn, msg) {
    var m = btn.closest(".card").querySelector(".dictation-msg");
    if (m) m.textContent = msg || "";
  }
  function setListening(btn, on) {
    var t = T();
    var box = btn.closest(".micbox");
    if (box) {
      btn.hidden = on;
      box.querySelector(".mic-live").hidden = !on;
    }
    btn.classList.toggle("listening", on);
    var l = btn.querySelector(".mic-label");
    if (l) l.textContent = on ? t.stop : t.dictate;
    btn.setAttribute("aria-label", on ? t.stopDictation : t.dictate);
  }
  function stopDictation() {
    if (rec) { try { rec.stop(); } catch (e) {} }
  }
  function toggleDictation(btn) {
    if (rec) { var same = recBtn === btn; stopDictation(); if (same) return; }
    startDictation(btn, true);
  }
  function startDictation(btn, tryLocal) {
    var t = T();
    var field = document.getElementById(btn.dataset.mic);
    var r = new SR();
    r.lang = state.lang || DEFAULT_LANG;
    r.continuous = true;
    r.interimResults = true;
    var local = false;
    if (tryLocal && "processLocally" in r) { r.processLocally = true; local = true; }
    var base = field.value.replace(/\s+$/, "");
    if (base) base += " ";
    var from = 0, seen = 0;   // results before `from` were thrown away with Reset
    rec = r; recBtn = btn;
    recReset = function () {
      from = seen;
      field.value = base.replace(/\s+$/, "");
      field.dispatchEvent(new Event("input", { bubbles: true }));
      say(btn, t.cleared);
    };
    setListening(btn, true);
    say(btn, t.listening + (local ? t.onDevice : "") + (btn.closest(".micbox") ? t.tapNextRedo : t.tapMicStop));
    r.onresult = function (e) {
      seen = e.results.length;
      var text = "";
      for (var k = from; k < e.results.length; k++) text += e.results[k][0].transcript;
      field.value = base + text.replace(/^\s+/, "");
      field.dispatchEvent(new Event("input", { bubbles: true }));
    };
    r.onerror = function (e) {
      if (local && (e.error === "language-not-supported" || e.error === "service-not-allowed")) {
        // No on-device model for this language: fall back to the browser's own speech service.
        r.onend = null; rec = null; setListening(btn, false);
        startDictation(btn, false);
        return;
      }
      say(btn, t.errors[e.error] || t.stopped(e.error));
      btn.dataset.err = "1";
    };
    r.onend = function () {
      if (rec === r) { rec = null; recBtn = null; recReset = null; }
      setListening(btn, false);
      if (!btn.dataset.err) say(btn, "");
      delete btn.dataset.err;
    };
    try { r.start(); } catch (e) { rec = null; setListening(btn, false); say(btn, t.cantStart); }
  }

  // ---------- Boot ----------
  function start() {
    render();
    layout();
    refresh();
    focusCurrent(false);
    requestAnimationFrame(function () { world.classList.add("animate"); });
    tick();
    setInterval(tick, 1000);
  }
  if (location.hash.indexOf("#share=") === 0) {
    decodeShare(location.hash.slice(7)).then(function (p) {
      sharedMode = true;
      sharedElapsed = +p.e || 0;
      state = stateFromPayload(p);
    }).catch(function () {}).then(start);
  } else {
    start();
  }
})();
</script>
</body>
</html>
